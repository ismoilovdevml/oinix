# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=oinix_img_dev --file "${iso_path}"
probe --set oinix_img_dev_uuid --fs-uuid "${oinix_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    oinix_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    oinix_platform='BIOS'
else
    oinix_platform="${grub_cpu}-${grub_platform}"
fi

default=oinix
timeout=15
timeout_style=menu


menuentry "OINIX Linux live medium (%ARCH%, ${oinix_platform})" --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${oinix_img_dev_uuid} img_loop="${iso_path}"
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "OINIX Linux live medium with speakup screen reader (%ARCH%, ${oinix_platform})" --hotkey s --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${oinix_img_dev_uuid} img_loop="${iso_path}" accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
