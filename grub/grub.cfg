insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod all_video

insmod font

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod gfxterm
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    oinix_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    oinix_platform='BIOS'
else
    oinix_platform="${grub_cpu}-${grub_platform}"
fi

default=oinix
timeout=15
timeout_style=menu


# Menu entries

menuentry "OINIX Linux live medium (%ARCH%, ${oinix_platform})" --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix' {
    set gfxpayload=keep
    search --no-floppy --set=root --fs-uuid %ARCHISO_UUID%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "OINIX Linux live medium (%ARCH%, ${oinix_platform}, Copy to RAM)" --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix-copytoram' {
    set gfxpayload=keep
    search --no-floppy --set=root --fs-uuid %ARCHISO_UUID%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "OINIX Linux live medium (%ARCH%, ${oinix_platform}, Safe graphics)" --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix-safe' {
    set gfxpayload=keep
    search --no-floppy --set=root --fs-uuid %ARCHISO_UUID%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "OINIX Linux live medium with speakup screen reader (%ARCH%, ${oinix_platform})" --hotkey s --class oinix --class arch --class gnu-linux --class gnu --class os --id 'oinix-accessibility' {
    set gfxpayload=keep
    search --no-floppy --set=root --fs-uuid %ARCHISO_UUID%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == 'i386' -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
