LABEL oinix
TEXT HELP
Boot the OINIX Linux live medium on BIOS.
It allows you to try OINIX Linux, install it, or perform system maintenance.
ENDTEXT
MENU LABEL OINIX Linux live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Copy the whole medium to RAM before booting (medium can be removed afterwards)
LABEL oinixram
TEXT HELP
Boot the OINIX Linux live medium on BIOS, copying it to RAM first.
The boot medium can be removed once the desktop has started.
ENDTEXT
MENU LABEL OINIX Linux live medium (%ARCH%, BIOS, Copy to ^RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram

# Fall back to a plain framebuffer when the GPU driver misbehaves
LABEL oinixsafe
TEXT HELP
Boot the OINIX Linux live medium on BIOS with basic graphics drivers.
Use this if the normal entry ends up with a black or corrupted screen.
ENDTEXT
MENU LABEL OINIX Linux live medium (%ARCH%, BIOS, ^Safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

# Accessibility boot option
LABEL oinixspeech
TEXT HELP
Boot the OINIX Linux live medium on BIOS with the speakup screen reader.
ENDTEXT
MENU LABEL OINIX Linux live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
