---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: false
    - name: "lightdm.service"
      action: "enable"
      mandatory: false
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "acpid.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    - name: "graphical.target"
      action: "enable"
      mandatory: false
    - name: "pacman-init.service"
      action: "disable"
      mandatory: false
    - name: "choose-mirror.service"
      action: "disable"
      mandatory: false
    - name: "reflector.service"
      action: "disable"
      mandatory: false
    - name: "livecd-alsa-unmuter.service"
      action: "disable"
      mandatory: false
    - name: "livecd-talk.service"
      action: "disable"
      mandatory: false
    - name: "sshd.service"
      action: "disable"
      mandatory: false
