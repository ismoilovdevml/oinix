---
dontChroot: false
timeout: 120
script:
    # Drop the live medium's password-less polkit rule and sudo override.
    - "-/usr/bin/rm -f /etc/polkit-1/rules.d/49-nopasswd-calamares.rules"
    - "-/usr/bin/rm -f /etc/sudoers.d/g_wheel"
    - "/bin/sh -c 'echo \"%wheel ALL=(ALL:ALL) ALL\" > /etc/sudoers.d/10-installer'"
    - "/usr/bin/chmod 0440 /etc/sudoers.d/10-installer"
    # Remove live-session autologin.
    - "-/usr/bin/rm -f /etc/lightdm/lightdm.conf.d/10-oinix-autologin.conf"
    - "-/usr/bin/rm -rf /etc/systemd/system/getty@tty1.service.d"
    # Remove archiso live scaffolding.
    - "-/usr/bin/rm -f /root/.automated_script.sh /root/.zlogin"
    - "-/usr/bin/rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-/usr/bin/rm -f /etc/mkinitcpio.d/linux.preset"
    - "-/usr/bin/rm -rf /etc/systemd/journald.conf.d/volatile-storage.conf"
    - "-/usr/bin/rm -rf /etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "-/usr/bin/rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount"
    - "-/usr/bin/rm -f /etc/systemd/system/pacman-init.service"
    - "-/usr/bin/rm -f /etc/systemd/system/choose-mirror.service"
    - "-/usr/bin/rm -f /usr/local/bin/choose-mirror /usr/local/bin/oinix-install /usr/local/bin/livecd-sound"
    - "-/usr/bin/rm -f /usr/local/bin/oinix-live-setup /etc/xdg/autostart/oinix-live-setup.desktop"
    - "-/usr/bin/rm -f /usr/share/applications/oinix-install.desktop"
    - "-/usr/bin/rm -rf /etc/calamares /usr/share/calamares"
    - "-/usr/bin/rm -f /etc/pacman.d/hooks/40-locale-gen.hook /etc/pacman.d/hooks/uncomment-mirrors.hook"
    # Regenerate a plain initramfs for the installed system.
    - "/usr/bin/mkinitcpio -P"
