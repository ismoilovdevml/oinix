---
defaultGroups:
    - name: users
      must_exist: false
      system: false
    - name: lp
    - name: video
    - name: network
    - name: storage
    - name: wheel
    - name: audio
    - name: power
    - name: optical
    - name: scanner

autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
setRootPassword: true
doReusePassword: false

passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1
    libpwquality:
        - minlen=4
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: false

userShell: /bin/bash

setHostname: EtcFile
writeHostsFile: true

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "oinix-${cpu}"
    forbidden_names: [ localhost ]

user:
    shell: /bin/bash
    forbidden_names: [ root ]
