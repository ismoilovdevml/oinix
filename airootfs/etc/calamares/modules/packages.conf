---
backend: pacman

pacman:
    num_retries: 3
    disable_download_timeout: true
    needed_only: true

update_db: false
update_system: false
skip_if_no_internet: true

operations:
    - remove:
        # Live-medium-only tooling that has no place on an installed system.
        - calamares
        - clonezilla
        - darkhttpd
        - edk2-shell
        - livecd-sounds
        - memtest86+
        - memtest86+-efi
        - mkinitcpio-archiso
        - refind
        - syslinux
